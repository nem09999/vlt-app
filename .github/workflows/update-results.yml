name: Update official Vietlott snapshots
on:
  schedule:
    - cron: '47 11 * * 2-6,0'
    - cron: '17 12 * * 2-6,0'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-results.yml'
      - 'scripts/collector.cjs'
      - 'scripts/collect-online.cjs'
      - 'lib/data.cjs'
permissions:
  contents: write
concurrency:
  group: vlt-official-snapshot-writer
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'nem09999/vlt-app' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read and validate official results
        run: node scripts/collect-online.cjs
      - name: Commit only validated snapshot changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- docs/latest.json docs/snapshots docs/receipts)" ]; then
            echo 'No new verified results'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/latest.json docs/snapshots docs/receipts
          git commit -m 'data: update verified Vietlott results'
          git push
