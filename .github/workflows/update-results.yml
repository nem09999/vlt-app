name: Update official Vietlott snapshots
on:
  schedule:
    - cron: '47 11 * * 2-6,0'
    - cron: '17 12 * * 2-6,0'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-results.yml'
      - 'scripts/collector.cjs'
      - 'scripts/collect-online.cjs'
      - 'scripts/minhngoc.cjs'
      - 'lib/data.cjs'
permissions:
  contents: write
concurrency:
  group: vlt-official-snapshot-writer
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'nem09999/vlt-app' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read and validate official results
        id: collect
        continue-on-error: true
        run: node scripts/collect-online.cjs
      - name: Commit only validated snapshot changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "${{ steps.collect.outcome }}" = 'success' ]; then
            git add docs/latest.json docs/snapshots docs/source-status.json
            if [ -d docs/receipts ]; then git add docs/receipts; fi
          else
            if [ -f docs/source-status.json ]; then git add docs/source-status.json; fi
          fi
          if git diff --cached --quiet; then
            echo 'No publishable change'
            exit 0
          fi
          git commit -m 'data: update verified Vietlott results'
          git push
      - name: Report source failure without changing latest snapshot
        if: steps.collect.outcome == 'failure'
        run: exit 1
