name: Lock prospective research predictions
on:
  schedule:
    - cron: '17 2 * * 2-6,0'
    - cron: '17 9 * * 2-6,0'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/lock-predictions.yml'
      - 'scripts/lock-predictions.py'
      - 'scripts/pilot01_rules.py'
      - 'scripts/evaluate-locks.cjs'
permissions:
  contents: write
concurrency:
  group: vlt-official-snapshot-writer
  cancel-in-progress: false
jobs:
  lock:
    outputs:
      binding: ${{ steps.generate.outputs.binding }}
    if: github.repository == 'nem09999/vlt-app' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install pinned numeric engine
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.5
      - name: Refresh and validate source snapshot
        run: node scripts/collect-online.cjs
      - name: Create each target once before cutoff
        id: generate
        run: python scripts/lock-predictions.py
      - name: Evaluate completed target draws
        run: node scripts/evaluate-locks.cjs
      - name: Commit research records atomically
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/latest.json docs/snapshots docs/receipts docs/source-status.json docs/locks
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: store research locks and source checks'
          git push
  confirm:
    needs: lock
    if: needs.lock.outputs.binding != ''
    name: Lock SHA256 ${{ needs.lock.outputs.binding }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Confirm bound record hashes in GitHub job metadata
        run: echo 'Record hash binding is in this job name; GitHub supplies completion time.'
